services:
  postgres:
    image: postgres:17-alpine
    container_name: nerv-postgres
    environment:
      POSTGRES_DB: nerv
      POSTGRES_USER: nerv
      POSTGRES_PASSWORD: nerv
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerv -d nerv"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nerv-postgres-data:/var/lib/postgresql/data

volumes:
  nerv-postgres-data:
