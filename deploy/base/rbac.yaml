apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nerv-readonly
  labels:
    app.kubernetes.io/name: nerv
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nerv-readonly
  labels:
    app.kubernetes.io/name: nerv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nerv-readonly
subjects:
  - kind: ServiceAccount
    name: nerv
    namespace: nerv
