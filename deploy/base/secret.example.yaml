apiVersion: v1
kind: Secret
metadata:
  name: nerv-secrets
  labels:
    app.kubernetes.io/name: nerv
type: Opaque
stringData:
  # Replace with ExternalSecret/Vault in homelab deployment.
  NERV_AUTH_TOKEN: "change-me"
  # Existing PostgreSQL service. Create a dedicated nerv database/user first.
  DATABASE_URL: "postgres://nerv:change-me@postgres.chi.svc.cluster.local:5432/nerv?sslmode=disable"
  # Agentgateway and Decision Gateway currently authenticate upstream providers;
  # set client tokens only if their internal routes enforce caller auth.
  NERV_AGENTGATEWAY_TOKEN: ""
  NERV_DECISION_GATEWAY_TOKEN: ""
  # Gotify application token created for NERV.
  NERV_GOTIFY_TOKEN: "change-me"
