apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nerv
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - nerv.int.mvaldes.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nerv
          port: 8080
