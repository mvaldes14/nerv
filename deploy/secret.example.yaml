apiVersion: v1
kind: Secret
metadata:
  name: nerv-secrets
  labels:
    app.kubernetes.io/name: nerv
type: Opaque
stringData:
  # Replace this with ExternalSecret/Vault in the homelab overlay.
  NERV_AUTH_TOKEN: "change-me"
  # Existing PostgreSQL / DBOS database URL. Placeholder for local manifest rendering only.
  DATABASE_URL: "postgres://nerv:nerv@postgres.nerv.svc.cluster.local:5432/nerv?sslmode=disable"
